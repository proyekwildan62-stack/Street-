          cat > app/src/main/AndroidManifest.xml << 'END_MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.danz.street">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.INTERACT_ACROSS_USERS_FULL" />
              <application
                  android:allowBackup="false"
                  android:label="STREET TOOLS"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@style/Theme.StreetTools"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ShizukuServer"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="local_shizuku_bridge" />
                  </service>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          END_MAN

          cat > app/src/main/java/com/danz/street/MainActivity.java << 'END_MA'
          package com.danz.street;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.core.content.ContextCompat;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private static final int REQ_PERM = 100;
              private static final int REQ_NOTIF = 101;
              private TextView txtStatus;
              private View dotStatus;
              private Button btnStart;

              private final Shizuku.OnRequestPermissionResultListener permListener =
                  (requestCode, grantResult) -> {
                      if (requestCode == REQ_PERM && grantResult == PackageManager.PERMISSION_GRANTED) {
                          startServer();
                      } else {
                          Toast.makeText(this, "Shizuku permission denied", Toast.LENGTH_LONG).show();
                      }
                  };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  txtStatus = findViewById(R.id.txt_status);
                  dotStatus = findViewById(R.id.dot_status);
                  btnStart = findViewById(R.id.btn_start);
                  Button btnStop = findViewById(R.id.btn_stop);
                  btnStart.setOnClickListener(v -> maybeStart());
                  btnStop.setOnClickListener(v -> {
                      stopService(new Intent(this, ShizukuServer.class));
                      setStatus(false);
                      Toast.makeText(this, "Server stopped", Toast.LENGTH_SHORT).show();
                  });
                  requestNotifPermission();
                  Shizuku.addRequestPermissionResultListener(permListener);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  setStatus(ShizukuServer.isRunning());
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener);
                  super.onDestroy();
              }

              private void setStatus(boolean online) {
                  if (online) {
                      txtStatus.setText("ONLINE");
                      txtStatus.setTextColor(ContextCompat.getColor(this, R.color.success_green));
                      dotStatus.setBackgroundColor(ContextCompat.getColor(this, R.color.success_green));
                      btnStart.setText("RUNNING");
                      btnStart.setEnabled(false);
                      btnStart.setAlpha(0.6f);
                  } else {
                      txtStatus.setText("OFFLINE");
                      txtStatus.setTextColor(ContextCompat.getColor(this, R.color.danger_red));
                      dotStatus.setBackgroundColor(ContextCompat.getColor(this, R.color.danger_red));
                      btnStart.setText("START SERVER");
                      btnStart.setEnabled(true);
                      btnStart.setAlpha(1.0f);
                  }
              }

              private void requestNotifPermission() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
                      }
                  }
              }

              private void maybeStart() {
                  boolean ok;
                  try { ok = Shizuku.pingBinder(); } catch (Throwable t) { ok = false; }
                  if (!ok) {
                      Toast.makeText(this, "Shizuku belum aktif. Buka Shizuku, Start dulu.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                      Shizuku.requestPermission(REQ_PERM);
                      return;
                  }
                  startServer();
              }

              private void startServer() {
                  Intent i = new Intent(this, ShizukuServer.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                  else startService(i);
                  setStatus(true);
                  Toast.makeText(this, "Server on 127.0.0.1:27042", Toast.LENGTH_SHORT).show();
              }
          }
          END_MA

          cat > app/src/main/java/com/danz/street/ShizukuServer.java << 'END_SS'
          package com.danz.street;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.Log;
          import java.io.ByteArrayOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import rikka.shizuku.Shizuku;
          import rikka.shizuku.ShizukuRemoteProcess;

          public class ShizukuServer extends Service {
              private static final String TAG = "StreetTools";
              private static final String CHANNEL_ID = "street_bridge";
              private static final int NOTIF_ID = 1001;
              private static final int PORT = 27042;
              private static volatile boolean sRunning = false;
              public static boolean isRunning() { return sRunning; }
              private ServerSocket ss;
              private volatile boolean running = true;

              @Override
              public void onCreate() {
                  super.onCreate();
                  sRunning = true;
                  createChannel();
                  startForeground(NOTIF_ID, buildNotif());
                  new Thread(this::acceptLoop, "accept").start();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Street Tools Bridge", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              private Notification buildNotif() {
                  Notification.Builder b = (Build.VERSION.SDK_INT >= 26)
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);
                  return b.setContentTitle("STREET TOOLS active")
                      .setContentText("Bridge on 127.0.0.1:" + PORT)
                      .setSmallIcon(android.R.drawable.stat_sys_upload_done)
                      .setOngoing(true).build();
              }

              private void acceptLoop() {
                  try {
                      ss = new ServerSocket(PORT, 8, InetAddress.getByName("127.0.0.1"));
                      Log.i(TAG, "listening " + PORT);
                      while (running) {
                          Socket s = ss.accept();
                          new Thread(() -> handle(s), "conn").start();
                      }
                  } catch (IOException e) { Log.e(TAG, "accept", e); }
              }

              private void handle(Socket s) {
                  try (DataInputStream in = new DataInputStream(s.getInputStream());
                       DataOutputStream out = new DataOutputStream(s.getOutputStream())) {
                      while (running) {
                          int cmd;
                          try { cmd = in.readInt(); } catch (IOException eof) { break; }
                          switch (cmd) {
                              case 0x01: {
                                  byte[] png = capturePng();
                                  out.writeInt(png.length);
                                  out.write(png);
                                  out.flush();
                                  break;
                              }
                              case 0x02: {
                                  int x = in.readInt(), y = in.readInt();
                                  runShell(new String[]{"input","tap",String.valueOf(x),String.valueOf(y)});
                                  out.writeInt(0);
                                  out.flush();
                                  break;
                              }
                              case 0x03: {
                                  int x1=in.readInt(),y1=in.readInt(),x2=in.readInt(),y2=in.readInt(),ms=in.readInt();
                                  runShell(new String[]{"input","swipe",
                                      String.valueOf(x1),String.valueOf(y1),
                                      String.valueOf(x2),String.valueOf(y2),
                                      String.valueOf(ms)});
                                  out.writeInt(0);
                                  out.flush();
                                  break;
                              }
                              case 0x04: {
                                  out.writeInt(Shizuku.pingBinder() ? 1 : 0);
                                  out.flush();
                                  break;
                              }
                              default: {
                                  out.writeInt(-1);
                                  out.flush();
                              }
                          }
                      }
                  } catch (IOException e) { Log.e(TAG, "handle", e); }
              }

              private byte[] capturePng() {
                  try {
                      ShizukuRemoteProcess p = Shizuku.newProcess(new String[]{"screencap","-p"}, null, null);
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = p.getInputStream().read(buf)) > 0) bos.write(buf, 0, n);
                      p.waitFor();
                      try { while (p.getErrorStream().read(buf) > 0) {} } catch (IOException ignored) {}
                      return bos.toByteArray();
                  } catch (Throwable e) {
                      Log.e(TAG, "capture", e);
                      return new byte[0];
                  }
              }

              private void runShell(String[] argv) {
                  try {
                      ShizukuRemoteProcess p = Shizuku.newProcess(argv, null, null);
                      p.waitFor();
                  } catch (Throwable e) { Log.e(TAG, "shell", e); }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }

              @Override
              public void onDestroy() {
                  running = false;
                  sRunning = false;
                  try { if (ss != null) ss.close(); } catch (IOException ignored) {}
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          END_SS

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: STREET-TOOLS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
