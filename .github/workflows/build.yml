name: Build STREET TOOLS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Scaffold project
        run: |
          set -e
          mkdir -p app/src/main/java/com/danz/street
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > .gitignore << 'END_GIT'
          .gradle/
          build/
          app/build/
          local.properties
          *.iml
          .idea/
          END_GIT

          cat > settings.gradle << 'END_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "street-tools"
          include ':app'
          END_SETTINGS

          cat > build.gradle << 'END_ROOT'
          plugins {
              id 'com.android.application' version '8.3.0' apply false
          }
          END_ROOT

          cat > gradle.properties << 'END_GP'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          END_GP

          cat > app/build.gradle << 'END_APPBUILD'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.danz.street'
              compileSdk 34
              defaultConfig {
                  applicationId "com.danz.street"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
              implementation 'androidx.core:core:1.12.0'
          }
          END_APPBUILD

          cat > app/proguard-rules.pro << 'END_PRO'
          -keep class rikka.shizuku.** { *; }
          -keep class moe.shizuku.** { *; }
          -keep class com.danz.street.** { *; }
          END_PRO

          cat > app/src/main/res/values/colors.xml << 'END_COL'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_black">#050505</color>
              <color name="bg_dark_purple">#1A0A28</color>
              <color name="neon_purple">#A020F0</color>
              <color name="text_white">#FFFFFF</color>
              <color name="text_gray">#8A8A9A</color>
              <color name="text_neon">#C975FF</color>
              <color name="danger_red">#FF3355</color>
              <color name="success_green">#00FF88</color>
          </resources>
          END_COL

          cat > app/src/main/res/values/strings.xml << 'END_STR'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STREET TOOLS</string>
          </resources>
          END_STR

          cat > app/src/main/res/values/themes.xml << 'END_THM'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.StreetTools" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg_black</item>
                  <item name="android:statusBarColor">@color/bg_black</item>
                  <item name="android:navigationBarColor">@color/bg_black</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          END_THM

          cat > app/src/main/res/drawable/bg_main.xml << 'END_BG'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:angle="270"
                  android:startColor="@color/bg_black"
                  android:centerColor="@color/bg_dark_purple"
                  android:endColor="@color/bg_black"
                  android:type="linear" />
          </shape>
          END_BG

          cat > app/src/main/res/drawable/btn_primary.xml << 'END_BP'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:angle="0"
                  android:startColor="#6A0DAD"
                  android:endColor="#A020F0"
                  android:type="linear" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#C975FF" />
          </shape>
          END_BP

          cat > app/src/main/res/drawable/btn_secondary.xml << 'END_BS'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A0A28" />
              <corners android:radius="12dp" />
              <stroke android:width="1.5dp" android:color="#FF3355" />
          </shape>
          END_BS

          cat > app/src/main/res/layout/activity_main.xml << 'END_LAY'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
